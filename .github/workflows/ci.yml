name: Build/test
on:
  push:
    branches:
      - "**"
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm install
      - run: npm run lint
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm run build
      - run: npm test
      - run: cargo test
